name: CI Backend

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint-and-test:
    name: Lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format)
        run: ruff format --check .
      - name: Tests
        run: pytest
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  migrations:
    name: Alembic against PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: citypass
          POSTGRES_PASSWORD: citypass
          POSTGRES_DB: reclamos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U citypass"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://citypass:citypass@localhost:5432/reclamos
        run: alembic upgrade head
      - name: alembic downgrade base
        env:
          DATABASE_URL: postgresql+asyncpg://citypass:citypass@localhost:5432/reclamos
        run: alembic downgrade base