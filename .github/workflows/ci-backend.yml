name: CI Backend

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint-and-test:
    name: Lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format)
        run: ruff format --check .
      - name: Tests
        run: pytest
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  browser-analitica:
    name: Iframe de Analitica en navegadores reales
    runs-on: ubuntu-latest
    # Normally under two minutes. Without a limit a hung step holds the job for
    # six hours, the workflow never completes, and the deploy that waits for it
    # (cd-backend.yml) never starts: it happened on main on 2026-11-18.
    timeout-minutes: 15
    env:
      # apt must never stop to ask a question nobody is there to answer.
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install test dependencies
        run: pip install -e ".[dev,browser]"
      # The step that hung: `--with-deps` runs apt-get on the runner, and that
      # one time it stalled after reading the package lists. Each attempt gets
      # four minutes; a stalled apt is killed and its locks cleared before the
      # next one, so one bad mirror does not fail the build.
      - name: Install browsers and their system libraries
        timeout-minutes: 14
        run: |
          for intento in 1 2 3; do
            if timeout --kill-after=10 240 \
                python -m playwright install --with-deps chromium firefox webkit; then
              exit 0
            fi
            echo "::warning::La instalacion de navegadores fallo o se colgo (intento $intento de 3)"
            sudo pkill -9 -x apt-get || true
            sudo pkill -9 -x dpkg || true
            sudo rm -f /var/lib/apt/lists/lock /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend
            sudo dpkg --configure -a || true
            sleep 10
          done
          echo "::error::No se pudieron instalar los navegadores en tres intentos"
          exit 1
      - name: HTTPS iframe tests
        timeout-minutes: 5
        run: pytest --no-cov tests/browser

  migrations:
    name: Alembic against PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: citypass
          POSTGRES_PASSWORD: citypass
          POSTGRES_DB: reclamos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U citypass"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://citypass:citypass@localhost:5432/reclamos
        run: alembic upgrade head
      - name: alembic downgrade base
        env:
          DATABASE_URL: postgresql+asyncpg://citypass:citypass@localhost:5432/reclamos
        run: alembic downgrade base

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download coverage report
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: coverage
      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t citypass-reclamos:${{ github.sha }} .
      # Building is not enough: the image ships without pip, so a dependency
      # that needed it at import time would only show up in the deploy.
      - name: La imagen carga la aplicacion
        run: >-
          docker run --rm -e KAFKA_ENABLED=false citypass-reclamos:${{ github.sha }}
          python -c "import app.main; print('rutas:', len(app.main.app.routes))"
      # Vulnerabilities in the base image and in the installed packages. The
      # critical and high ones that already have a fix break the build: those
      # are the ones a rebuild or a version bump solves. Unfixed ones would
      # turn the build red with nothing anybody could do about it.
      - name: Trivy (criticas y altas con arreglo disponible)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: citypass-reclamos:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

  secretos:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history: gitleaks reads the commits, not just the tree.
          fetch-depth: 0
      # A credential committed by mistake stays in the history of a public
      # repository for good, so the check runs on every push and pull request.
      # Reviewed false positives are listed in .gitleaksignore.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
