name: Cierre automatico de reclamos

# A claim that sits in RESUELTO for more than DIAS_CIERRE_AUTOMATICO days with no
# answer from the neighbour is closed (US-17). The code that does it lives in
# `ReclamoService.cerrar_resueltos_vencidos` and used to run only from the
# worker loop (`app/worker.py`). Production deploys the API and nothing else,
# so in production it never ran.
#
# This workflow is the trigger production was missing: once a day it logs in as
# an administrator and calls the maintenance endpoint. The endpoint is
# idempotent, so a repeated or a manual run closes nothing twice.
#
# Why a scheduled workflow and not a second service: Render's free plan has no
# background workers, and one HTTP call a day does not justify one.
#
# GitHub only runs scheduled workflows from the default branch, so this starts
# working once it reaches main.

on:
  schedule:
    # 09:23 UTC, 06:23 in Buenos Aires: before the municipal working day, and
    # off the hour, when GitHub is most likely to delay a run.
    - cron: "23 9 * * *"
  workflow_dispatch:

# No repository access: the job only talks to the API and the identity provider.
permissions: {}

concurrency:
  group: cierre-automatico
  cancel-in-progress: false

jobs:
  cerrar:
    name: Cerrar los reclamos vencidos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API: https://apis2-g5-reclamos-backend.onrender.com
      IDP_LOGIN: https://api.citypass-login.pp.ua/auth/login
    steps:
      - name: Despertar el servicio
        run: |
          # The free plan may be asleep; a cold start can take a minute.
          curl --fail --silent --show-error \
               --retry 3 --retry-delay 15 --retry-all-errors \
               --max-time 90 \
               "$API/health"
          echo

      - name: Cerrar los vencidos
        env:
          USUARIO: ${{ secrets.IDP_ADMIN_USUARIO }}
          PASSWORD: ${{ secrets.IDP_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$USUARIO" ] || [ -z "$PASSWORD" ]; then
            echo "::error::Faltan los secrets IDP_ADMIN_USUARIO e IDP_ADMIN_PASSWORD"
            exit 1
          fi

          # jq builds the body so a quote in the password cannot break the JSON.
          cuerpo=$(jq -n --arg u "$USUARIO" --arg p "$PASSWORD" \
            '{username: $u, password: $p, clientId: "citypass-reclamos-web"}')

          # One attempt only: five failed logins lock the account for ten minutes.
          token=$(curl --fail --silent --show-error --max-time 30 \
            -H "Content-Type: application/json" -d "$cuerpo" "$IDP_LOGIN" \
            | jq -r '.access_token')
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "::error::El Login Federado no devolvio un token"
            exit 1
          fi
          echo "::add-mask::$token"

          respuesta=$(curl --fail --silent --show-error --max-time 120 \
            -X POST -H "Authorization: Bearer $token" \
            "$API/api/v1/reclamos/mantenimiento/cierre-automatico")

          echo "Reclamos cerrados: $(echo "$respuesta" | jq -r '.cerrados')"
          echo "$respuesta" | jq -r '.reclamo_ids[]?' | sed 's/^/  - /'
