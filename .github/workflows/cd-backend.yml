name: CD Backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image (chequeo rápido de que el Dockerfile compila)
        run: docker build -t citypass-reclamos:${{ github.sha }} .

      - name: Instalar Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy en Railway
        run: railway up --service 43e5f259-63e6-4d96-a863-35f7542d6425 --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}