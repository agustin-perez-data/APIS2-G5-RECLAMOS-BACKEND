[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "citypass-reclamos"
version = "0.1.0"
description = "CityPass+ | Grupo 5 - Reclamos y Participacion Ciudadana (backend)"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "aiokafka>=0.12",
    "pyjwt[crypto]>=2.10",
    "python-multipart>=0.0.17",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "aiosqlite>=0.20",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]  # FastAPI puts calls in argument defaults (Depends/Query)

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=60"

[tool.coverage.run]
source = ["app"]
omit = ["app/worker.py", "app/core/logging.py"]
