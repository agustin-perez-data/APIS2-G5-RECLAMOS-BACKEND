[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "citypass-reclamos"
version = "0.1.0"
description = "CityPass+ | Grupo 5 - Reclamos y Participacion Ciudadana (backend)"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # The email extra (email-validator) is pure Python and from the same author:
    # the email is the citizens' login identifier and validating it with a regex
    # of our own is a classic source of bugs (ADR 0011).
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "aiokafka>=0.12",
    # Decodes the Avro records of the CityPass+ bus (ADR 0023). aiokafka reads
    # the bytes; this turns them into the event, against the registry's schema.
    "fastavro>=1.9",
    # CA bundle for the TLS connection to the bus' broker. It already came with
    # httpx; listed because `app/events/bus.py` imports it directly.
    "certifi>=2024.2",
    "pyjwt[crypto]>=2.10",
    # Authenticated encryption of the human JWT held by Analytics sessions.
    "cryptography>=43",
    "python-multipart>=0.0.17",
    "structlog>=24.4",
    # HTTP client for the Jira integration; it already came with the dev extras
    # for the API tests, so it adds nothing new to the environment.
    "httpx>=0.28",
    "slowapi>=0.1.9",
    # Official Prometheus client, pure Python. Counters and histograms with
    # labels, and the exposition format, are easy to get subtly wrong by hand.
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "aiosqlite>=0.20",
    "ruff>=0.8",
    # Reads render.yaml in scripts/render_config.py and its tests. It already
    # came with uvicorn[standard]; listed so that does not stay an accident.
    "pyyaml>=6.0",
]

browser = ["playwright>=1.50"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Third-party agent skills: their markdown carries Python snippets that ruff
# would try to format. Not our code, so it does not gate the build.
extend-exclude = [".agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]  # FastAPI puts calls in argument defaults (Depends/Query)

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=60"

[tool.coverage.run]
source = ["app"]
concurrency = ["greenlet", "thread"]
omit = ["app/worker.py", "app/core/logging.py"]
